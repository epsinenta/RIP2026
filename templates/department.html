<html lang="ru">
    <head>
        <title>{{ .department.Title }} — Подробная информация</title>
        <link rel="stylesheet" href="/static/styles/index_style.css">
    </head>
    <body class="vibes-page">
        <header class="header-center">
            <a href="/" class="header-logo">
                <img src="/static/img/logo.png" alt="Логотип">
            </a>
        </header>
        <div class="vibes-viewport">
            <video class="vibes-video" controls autoplay muted loop>
                <source src="{{ $.minioUrl }}/{{ .department.Video }}" type="video/mp4">
            </video>
            <div class="vibes-overlay"></div>
            <a href="/" class="vibes-back">
                <span class="vibes-back__icon">←</span>
                <span>Назад</span>
            </a>
            <div class="vibes-content">
                <h1 class="vibes-title">{{ .department.Title }}</h1>
                <p class="vibes-meta">Сотрудников: {{ .department.EmployeeCount }} · Подчиняется: {{ .department.ReportsTo }}</p>
                <p class="vibes-description">{{ .department.ShortDescription }}</p>
                <div class="vibes-manager">
                    <span class="vibes-manager__label">Руководитель</span>
                    <span class="vibes-manager__name">{{ .department.Head }}</span>
                </div>
                <form method="POST" action="/department_application/add" style="margin-top: 16px;">
                    <input type="hidden" name="department_id" value="{{ .department.DepartmentID }}">
                    <button type="submit" class="search-btn">Добавить в заявку</button>
                </form>
            </div>
        </div>
    </body>
</html>
