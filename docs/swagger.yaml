basePath: /api
definitions:
  web_backend_internal_app_serializer.DepartmentApplicationDepartmentJSON:
    properties:
      department_application_id:
        type: integer
      department_id:
        type: integer
      direction:
        type: string
      main_department_id:
        type: integer
      role:
        type: string
      salary:
        type: number
      sort_order:
        type: integer
    type: object
  web_backend_internal_app_serializer.DepartmentApplicationJSON:
    properties:
      created_at:
        type: string
      creator_login:
        type: string
      department_application_id:
        type: integer
      finish_date:
        type: string
      forming_date:
        type: string
      incomplete_items_count:
        type: integer
      moderator_login:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  web_backend_internal_app_serializer.DepartmentJSON:
    properties:
      department_id:
        type: integer
      description:
        type: string
      employee_count:
        type: integer
      head:
        type: string
      is_deleted:
        type: boolean
      photo_url:
        type: string
      reports_to:
        type: string
      short_description:
        type: string
      short_description_en:
        type: string
      title:
        type: string
      video:
        type: string
    type: object
  web_backend_internal_app_serializer.SignInRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  web_backend_internal_app_serializer.SignUpRequest:
    properties:
      is_moderator:
        type: boolean
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  web_backend_internal_app_serializer.SignUpResponse:
    properties:
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
  web_backend_internal_app_serializer.StatusJSON:
    properties:
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://localhost:8080
  description: API для управления заявками отделов
  license:
    name: MIT
  title: Department Application API
  version: "1.0"
paths:
  /dep_app_dep/{department_id}/{department_application_id}:
    delete:
      description: Удаляет связь отдела и заявки
      parameters:
      - description: ID отдела
        in: path
        name: department_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: department_application_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "400":
          description: Неверные ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить отдел из заявки
      tags:
      - department_application_departments
    put:
      consumes:
      - application/json
      description: Обновляет параметры отдела в конкретной заявке
      parameters:
      - description: ID отдела
        in: path
        name: department_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: department_application_id
        required: true
        type: integer
      - description: Новые данные
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationDepartmentJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленные данные
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationDepartmentJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить данные отдела в заявке
      tags:
      - department_application_departments
  /dep_app_dep/add/{department_id}:
    post:
      description: Добавляет отдел в заявку-черновик пользователя
      parameters:
      - description: ID отдела
        in: path
        name: department_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка с добавленным отделом
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "201":
          description: Создана новая заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Отдел не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Отдел уже в заявке
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить отдел в заявку
      tags:
      - department_application_departments
  /department/{id}:
    get:
      description: Возвращает информацию об отделе по идентификатору
      parameters:
      - description: ID отдела
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные отдела
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentJSON'
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Отдел не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить отдел по ID
      tags:
      - departments
  /department/create-department:
    post:
      consumes:
      - application/json
      description: Создает новый отдел
      parameters:
      - description: Данные нового отдела
        in: body
        name: department
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentJSON'
      produces:
      - application/json
      responses:
        "201":
          description: Созданный отдел
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создать отдел
      tags:
      - departments
  /department_application/{id}:
    get:
      description: Возвращает полную информацию о заявке
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные заявки с устройствами
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить заявку по ID
      tags:
      - department_applications
  /department_application/{id}/delete-department_application:
    delete:
      description: Выполняет логическое удаление заявки
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статус удаления
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить заявку
      tags:
      - department_applications
  /department_application/{id}/edit-department_application:
    put:
      consumes:
      - application/json
      description: Обновляет данные заявки
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные заявки
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить заявку
      tags:
      - department_applications
  /department_application/{id}/finish-department_application:
    put:
      consumes:
      - application/json
      description: Изменяет статус заявки (только для модераторов)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус (completed/rejected)
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.StatusJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Результат модерации
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Завершить заявку
      tags:
      - department_applications
  /department_application/{id}/form-department_application:
    put:
      description: Переводит заявку в статус "formed"
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сформированная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Сформировать заявку
      tags:
      - department_applications
  /department_application/all-department_applications:
    get:
      description: Возвращает заявки с возможностью фильтрации по датам и статусу
      parameters:
      - description: Начальная дата (YYYY-MM-DD)
        in: query
        name: from-date
        type: string
      - description: Конечная дата (YYYY-MM-DD)
        in: query
        name: to-date
        type: string
      - description: Статус заявки
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentApplicationJSON'
            type: array
        "400":
          description: Неверный формат даты
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить список заявок
      tags:
      - department_applications
  /department_application/department_application-cart:
    get:
      description: Возвращает информацию о текущей заявке-черновике пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Данные корзины или no_draft
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить корзину заявки
      tags:
      - department_applications
  /departments:
    get:
      description: Возвращает все отделы или фильтрует по названию
      parameters:
      - description: Название отдела для поиска
        in: query
        name: Title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список отделов
          schema:
            items:
              $ref: '#/definitions/web_backend_internal_app_serializer.DepartmentJSON'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить список отделов
      tags:
      - departments
  /users/signin:
    post:
      consumes:
      - application/json
      description: Принимает логин/пароль, возвращает jwt-токен в формате {"token":"..."}.
      parameters:
      - description: Логин и пароль
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход (получение токена)
      tags:
      - users
  /users/signout:
    post:
      description: Удаляет токен текущего пользователя из blacklist. 204 No Content.
      produces:
      - application/json
      responses:
        "204":
          description: Токен добавлен в blacklist
        "400":
          description: Проблема с получением user_id
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка при удалении токена
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход (удаление токена)
      tags:
      - users
  /users/signup:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя. Возвращает login и is_moderator
        (без id и пароля).
      parameters:
      - description: Логин и пароль
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SignUpResponse'
        "400":
          description: Ошибка валидации или входных данных
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
